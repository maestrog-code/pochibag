<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order received | PochiBag</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .success-page{min-height:100vh;display:grid;place-items:center;padding:2rem;background:#171412;color:#f8f1e7;text-align:center}.success-card{max-width:560px;padding:3rem 2rem;border:1px solid rgba(218,177,94,.35);background:#211c19}.success-card h1{font:500 clamp(2.5rem,7vw,5rem)/.95 Georgia,serif;margin:.5rem 0 1rem}.success-card p{color:#c9bfb5;line-height:1.7}.order-id{display:inline-block;margin:1rem 0;padding:.8rem 1.1rem;border:1px solid #c99e4b;color:#f2c76d;font-weight:700;letter-spacing:.08em}.success-actions{display:flex;justify-content:center;gap:.8rem;flex-wrap:wrap;margin-top:1.5rem}.success-actions a{color:#171412;background:#e4b45c;padding:.75rem 1.1rem;text-decoration:none}.success-actions a.secondary{color:#f8f1e7;background:transparent;border:1px solid #6f6257}
  </style>
</head>
<body>
  <main class="success-page">
    <section class="success-card" aria-labelledby="success-title">
      <p class="eyebrow">Order received</p>
      <h1 id="success-title">Thank you for shopping with PochiBag.</h1>
      <p>Your order has been saved. Our store team has been notified at <a href="mailto:maestrogambis@gmail.com" style="color:#f2c76d">maestrogambis@gmail.com</a> and will contact you to confirm availability and delivery details.</p>
      <p class="order-id" id="orderId">Order ID: loading…</p>
      <div class="success-actions"><a href="shop.html">Continue shopping</a><a class="secondary" href="index.html">Back to home</a></div>
    </section>
  </main>
  <script>const id = new URLSearchParams(location.search).get('order'); document.getElementById('orderId').textContent = id ? `Order ID: ${id}` : 'Order received';</script>
</body>
</html>
